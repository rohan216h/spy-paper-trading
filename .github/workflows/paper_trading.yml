name: SPY Paper Trading

on:
  schedule:
    # Every 5 min, 13:30-21:00 UTC, Mon-Fri.
    # This window is a generous superset covering US market hours
    # (9:30am-4:00pm ET) in BOTH daylight saving time (EDT, UTC-4) and
    # standard time (EST, UTC-5) - so it doesn't need manual adjustment
    # twice a year. Runs outside the true session just see an unchanged
    # latest bar and do nothing (see the "already processed" check in
    # run_paper_trading.py).
    - cron: "*/5 13-21 * * 1-5"
  workflow_dispatch: {}   # lets you manually trigger a run from the Actions tab, for testing

permissions:
  contents: write   # needed so the workflow can commit updated state.json/trade_log.csv back

jobs:
  run-paper-trading:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run paper trading check
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        # NOTE: dry run for now (no --live flag). Add --live once you've
        # watched a few runs behave correctly in the Actions logs.
        run: python paper_trading/run_paper_trading.py

      - name: Commit updated state and log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add paper_trading/state.json paper_trading/trade_log.csv
          git diff --staged --quiet || git commit -m "Update paper trading state [skip ci]"
          git push
